<!DOCTYPE html>
<!-- изменено 2026-09-21 13:10 -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Будни_BY — статистика</title>
<meta name="description" content="Сколько вакансий в базе Будни_BY, по сферам и по областям Беларуси.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://app.budni.tg-studio.xyz/stats.html">
<script>
(function(){
  var scheme = (matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', scheme);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=20260920a">
<style>
  .wrap{ max-width:480px; margin:0 auto; }
  .hero{ text-align:center; padding:20px 0 8px; }
  .hero h1{ font-size:20px; font-weight:700; margin:0 0 4px; }
  .hero p{ color:var(--ink-soft); font-size:13px; margin:0; line-height:1.5; }

  .total-tile{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 16px; text-align:center; margin:16px 0;
  }
  .total-value{ font-family:'JetBrains Mono',monospace; font-size:40px; font-weight:700; color:var(--accent); line-height:1; }
  .total-label{ color:var(--ink-soft); font-size:13px; margin-top:8px; }

  .section{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:14px;
  }
  .section h2{ font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-soft); margin:0 0 8px; }

  .brow{ padding:9px 0; border-bottom:1px solid var(--line); }
  .brow:last-child{ border-bottom:none; }
  .brow-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:14px; }
  .brow-num{ font-family:'JetBrains Mono',monospace; color:var(--ink-soft); white-space:nowrap; flex:none; font-size:13px; }
  .brow-dim .brow-top span:first-child{ color:var(--ink-faint); }
  .bar{ height:4px; border-radius:2px; background:var(--surface-3); margin-top:7px; overflow:hidden; }
  .bar i{ display:block; height:100%; background:var(--accent); border-radius:2px; }

  .skel{ height:16px; border-radius:6px; background:var(--surface-3); margin:9px 0;
    animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.5; } 50%{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .skel{ animation:none; } }

  .err{ text-align:center; padding:20px 12px; color:var(--ink-soft); font-size:14px; }
  .err button{
    margin-top:12px; min-height:44px; padding:0 20px; border-radius:999px; border:none;
    background:var(--accent); color:#fff; font-family:'Chakra Petch',sans-serif; font-weight:600;
    font-size:14px;
  }

  .cta{ display:flex; gap:10px; margin:18px 0 6px; }
  .cta a{
    flex:1; min-height:48px; display:flex; align-items:center; justify-content:center; gap:8px;
    border-radius:999px; text-decoration:none; font-family:'Chakra Petch',sans-serif; font-weight:600;
    font-size:14px; border:1px solid var(--line);
  }
  .cta a.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .cta a.ghost{ background:var(--surface); color:var(--ink); }

  .upd{ text-align:center; color:var(--ink-faint); font-size:11px; margin:14px 0 4px; }
</style>
</head>
<body>
<div class="content wrap">

  <div class="hero">
    <h1>📊 Будни_BY — статистика</h1>
    <p>Вакансии и подработки в Беларуси, база обновляется каждый день</p>
  </div>

  <div id="view">
    <div class="total-tile">
      <div class="skel" style="width:60%;height:40px;margin:0 auto;"></div>
    </div>
    <div class="section">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
  </div>

  <div class="cta">
    <a class="primary" href="https://t.me/Budni_BY_Bot" target="_blank" rel="noopener">🤖 Открыть бота</a>
    <a class="ghost" href="https://t.me/Budni_BY_Group" target="_blank" rel="noopener">💬 Группа</a>
  </div>
  <div class="upd" id="upd"></div>

</div>

<script src="app.js?v=20260920a"></script>
<script>
function renderRows(obj) {
  var keys = Object.keys(obj || {}).filter(function (k) { return obj[k] > 0; })
    .sort(function (a, b) { return obj[b] - obj[a]; });
  if (!keys.length) return '<div class="brow-dim"><div class="brow-top"><span>Пока нет данных</span></div></div>';
  var max = obj[keys[0]] || 1;
  return keys.map(function (k) {
    return '<div class="brow"><div class="brow-top"><span>' + escapeHtml(k) + '</span>' +
      '<span class="brow-num">' + obj[k] + '</span></div>' +
      '<div class="bar"><i style="width:' + Math.round(obj[k] / max * 100) + '%"></i></div></div>';
  }).join('');
}

function renderError() {
  document.getElementById('view').innerHTML =
    '<div class="section err">Не получилось загрузить статистику — проверьте связь.' +
    '<br><button onclick="load()">Повторить</button></div>';
}

async function load() {
  document.getElementById('upd').textContent = '';
  try {
    var res = await apiCall({ action: 'public_stats' });
    if (!res || !res.ok) { renderError(); return; }
    var html =
      '<div class="total-tile"><div class="total-value">' + (res.total || 0) + '</div>' +
      '<div class="total-label">вакансий в базе</div></div>' +
      '<div class="section"><h2>По сферам</h2>' + renderRows(res.bySector) + '</div>' +
      '<div class="section"><h2>По областям Беларуси</h2>' + renderRows(res.byOblast) + '</div>';
    document.getElementById('view').innerHTML = html;
    document.getElementById('upd').textContent =
      'Обновлено ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    renderError();
  }
}

initTelegram();
load();
</script>
</body>
</html>
