     Синхронизировано с description-pic.html (картинка бота) — тот же бренд-блок и карта областей. -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>og-image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1012; --panel:#15191c; --line:rgba(255,255,255,.10);
    --blue:#2aabee; --blue-300:#8ad4f7; --teal:#4fc9b8; --ink:#eef1f2; --ink-2:#a7afb5; --ink-3:#7b838a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1200px; height:630px; background:var(--bg); overflow:hidden; }
  body{ position:relative; font-family:'Inter',sans-serif; color:var(--ink); }

  /* свечение акцента справа сверху + сетка-«чертёж» как в стиле студии */
  .glow{ position:absolute; inset:0;
    background:
      radial-gradient(640px 420px at 88% 8%, rgba(42,171,238,.28), transparent 70%),
      radial-gradient(520px 360px at 6% 104%, rgba(42,171,238,.12), transparent 70%); }
  .grid{ position:absolute; inset:0; opacity:.5;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(ellipse 80% 90% at 75% 20%, #000 0%, transparent 75%);
            mask-image:radial-gradient(ellipse 80% 90% at 75% 20%, #000 0%, transparent 75%); }

  /* контур областей Беларуси — те же геоданные и путь, что в description-pic.html бота */
  .blr-map{ position:absolute; right:40px; top:70px; width:500px; height:auto; }
  .blr-map path{ fill:rgba(79,201,184,.07); stroke:rgba(79,201,184,.45); stroke-width:2.5; stroke-linejoin:round; }

  .frame{ position:absolute; inset:0; padding:52px 68px 48px; display:flex; flex-direction:column; }

  .brand{ display:flex; align-items:center; gap:20px; }
  .mark{ width:80px; height:80px; border-radius:22px; flex:none;
    background:linear-gradient(135deg, var(--blue) 0%, var(--teal) 100%); color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 18px 40px -14px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.25);
    position:relative; overflow:hidden;
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:44px; }
  .mark::before{ content:''; position:absolute; inset:0;
    background:linear-gradient(160deg, rgba(255,255,255,.32) 0%, rgba(255,255,255,0) 45%); }
  .mark span{ position:relative; text-shadow:0 4px 10px rgba(0,0,0,.3); }
  .name{ font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:42px; letter-spacing:.01em; color:var(--ink-2); }
  .name b{ color:var(--blue-300); font-weight:700; }

  h1{ margin-top:auto; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:76px;
    line-height:1.05; letter-spacing:.005em; max-width:600px; }
  h1 em{ font-style:normal; color:var(--blue); }

  .foot{ margin-top:38px; padding-top:22px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    font-family:'JetBrains Mono',monospace; font-weight:500; font-size:22px; color:var(--ink-2); }
  .foot .url{ color:var(--ink); font-weight:700; }
  .foot .tg{ color:var(--blue-300); }
</style>
</head>
